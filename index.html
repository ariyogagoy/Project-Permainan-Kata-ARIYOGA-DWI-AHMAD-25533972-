<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Susun Kata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game">
    <header class="topbar">
      <h1>Susun Kata</h1>
      <dl class="stats">
        <div><dt>Ronde</dt><dd id="round">1/10</dd></div>
        <div><dt>Skor</dt><dd id="score">0</dd></div>
        <div><dt>Beruntun</dt><dd id="streak">0</dd></div>
      </dl>
    </header>

    <div class="timer" role="progressbar" aria-label="Sisa waktu" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30">
      <span id="timerBar"></span>
    </div>

    <p class="category">Kategori: <strong id="category">-</strong></p>

    <div class="slots" id="slots" aria-label="Jawabanmu"></div>
    <div class="tiles" id="tiles" aria-label="Huruf acak"></div>

    <p class="message" id="message" role="status" aria-live="polite">Ketik atau ketuk huruf untuk menyusun kata.</p>

    <div class="actions">
      <button type="button" id="btnClear">Hapus</button>
      <button type="button" id="btnShuffle">Acak ulang</button>
      <button type="button" id="btnHint">Petunjuk (−5)</button>
      <button type="button" id="btnSkip">Lewati</button>
    </div>
  </main>

  <section class="overlay" id="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <h2 id="endTitle">Permainan selesai</h2>
      <p class="final" id="finalScore">0</p>
      <p id="finalInfo"></p>
      <button type="button" id="btnRestart" class="primary">Main lagi</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
